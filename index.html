<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RMAIL MESSENGER v460 - PT BKI</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #007aff; --bg: #010409; --panel: #0d1117; --border: rgba(255,255,255,0.08); }
        body { background: var(--bg); color: #e6edf3; font-family: 'Plus Jakarta Sans', sans-serif; height: 100dvh; overflow: hidden; margin:0; }
        .screen { position: fixed; inset: 0; background: var(--bg); transform: translateX(100%); transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 100; }
        .screen-active { transform: translateX(0); }
        .glass { background: rgba(13, 17, 23, 0.8); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); }
        .avatar { width: 50px; height: 50px; border-radius: 18px; background: #161b22; display: flex; align-items: center; justify-content: center; font-weight: 800; border: 1px solid var(--border); flex-shrink: 0; overflow: hidden; position: relative; }
        .bubble { max-width: 85%; padding: 12px; border-radius: 20px; font-size: 14px; margin-bottom: 8px; position: relative; cursor: pointer; transition: opacity 0.2s; }
        .bubble:active { opacity: 0.6; }
        .b-me { background: var(--accent); align-self: flex-end; border-bottom-right-radius: 4px; }
        .b-them { background: #21262d; align-self: flex-start; border-bottom-left-radius: 4px; }
        .img-msg { width: 100%; max-height: 250px; object-fit: cover; border-radius: 12px; margin-top: 5px; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(15px); z-index: 3000; display: none; align-items: center; justify-content: center; padding: 25px; }
        .modal-box { background: var(--panel); border: 1px solid var(--border); width: 100%; max-width: 320px; border-radius: 35px; padding: 30px; text-align: center; }
    </style>
</head>
<body>

<input type="file" id="file-helper" accept="image/*" class="hidden" onchange="handleFileSelect(event)">

<div id="custom-modal" class="modal-overlay">
    <div class="modal-box">
        <h3 id="modal-title" class="font-black text-white uppercase mb-1"></h3>
        <p id="modal-desc" class="text-[10px] text-gray-500 font-bold uppercase mb-6"></p>
        <div id="modal-input-wrap"><input type="text" id="modal-input" class="w-full bg-black p-4 rounded-2xl border border-white/5 outline-none mb-6 text-sm font-bold text-center text-blue-500"></div>
        <div id="member-list-area" class="max-h-48 overflow-y-auto mb-6 hidden text-left space-y-2"></div>
        <div class="flex gap-3">
            <button onclick="closeM()" class="flex-1 text-gray-500 font-black text-[10px] uppercase">Batal</button>
            <button id="modal-confirm" class="flex-1 bg-blue-600 py-4 rounded-2xl font-black text-[10px] uppercase text-white">OK</button>
        </div>
    </div>
</div>

<div id="auth-gate" class="fixed inset-0 z-[9999] bg-[#010409] flex flex-col items-center justify-center p-8">
    <div class="w-full max-w-xs text-center">
        <h1 class="text-7xl font-black mb-2 italic tracking-tighter">RM<span class="text-blue-500">.</span></h1>
        <p class="text-[9px] font-bold text-gray-600 uppercase mb-12 tracking-[0.6em]">PT Bangga Karya Indonesia</p>
        <div class="space-y-3">
            <input type="text" id="login-user" placeholder="USERNAME" class="w-full p-5 bg-[#0d1117] border border-white/5 rounded-3xl outline-none font-bold uppercase text-center">
            <input type="password" id="login-pass" placeholder="PASSWORD" class="w-full p-5 bg-[#0d1117] border border-white/5 rounded-3xl outline-none font-bold text-center">
            <button onclick="doLogin()" class="w-full bg-blue-600 py-5 rounded-3xl font-black text-white uppercase text-[11px] mt-4">Login Account</button>
        </div>
    </div>
</div>

<div class="flex flex-col h-screen">
    <header class="glass p-6 pt-12 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div id="my-av" onclick="triggerGallery()" class="avatar !w-10 !h-10 cursor-pointer"></div>
            <div><h1 id="my-name" class="text-sm font-black uppercase">...</h1><p class="text-[8px] font-bold text-green-500 uppercase">System Active</p></div>
        </div>
        <div class="flex gap-2">
            <button onclick="openCreateGroup()" class="w-10 h-10 bg-blue-600/20 text-blue-500 rounded-xl flex items-center justify-center font-bold">＋G</button>
            <button onclick="openLogoutM()" class="w-10 h-10 bg-red-900/20 text-red-500 rounded-xl flex items-center justify-center font-bold">✕</button>
            <button onclick="openSearch()" class="w-10 h-10 bg-[#161b22] rounded-xl flex items-center justify-center">🔍</button>
        </div>
    </header>
    <div id="chat-list" class="flex-1 overflow-y-auto"></div>
</div>

<div id="chat-screen" class="screen flex flex-col">
    <header class="glass p-4 pt-10 flex items-center gap-4">
        <button onclick="closeChat()" class="p-2 text-2xl">←</button>
        <div id="r-av" class="avatar !w-10 !h-10"></div>
        <div class="flex-1 overflow-hidden" onclick="openGroupInfo()">
            <h3 id="r-name" class="font-bold text-sm uppercase truncate">...</h3>
            <p id="r-status" class="text-[9px] font-black uppercase text-blue-500 italic">Tap info</p>
        </div>
        <div id="group-ctrl" class="hidden flex gap-2">
            <button onclick="openInvite()" class="bg-blue-600 px-3 py-1 rounded-lg text-[9px] font-black italic">INVITE</button>
            <button onclick="openKick()" class="bg-red-600 px-3 py-1 rounded-lg text-[9px] font-black italic">KICK</button>
        </div>
    </header>
    <div id="canvas" class="flex-1 overflow-y-auto p-5 flex flex-col"></div>
    <div class="p-4 bg-[#0d1117] flex flex-col gap-2 pb-10">
        <div class="flex gap-2 items-center">
            <button onclick="openMedia('image')" class="text-xl">🖼️</button>
            <button onclick="openMedia('file')" class="text-xl">📁</button>
            <input type="text" id="msg-in" placeholder="Ketik /saran atau /kodeblue..." class="flex-1 bg-[#161b22] p-4 rounded-2xl outline-none border border-white/5 text-sm">
            <button onclick="doSend('text')" class="w-12 h-12 bg-blue-600 rounded-full flex items-center justify-center font-bold">➤</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDwT0SeUkimENH3yTg2jzf_atlyFfh3_nU",
        authDomain: "rmail-68719.firebaseapp.com",
        databaseURL: "https://rmail-68719-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "rmail-68719",
        storageBucket: "rmail-68719.firebasestorage.app",
        messagingSenderId: "408858505940",
        appId: "1:408858505940:web:b7a594adfd4be9725d8141"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let me = null, curT = "", chatRef = null, modalCB = null;

    function openM(title, desc, placeholder, hasInput, btnText, callback, isMemberArea = false) {
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-desc').innerText = desc;
        document.getElementById('modal-input-wrap').style.display = hasInput ? 'block' : 'none';
        document.getElementById('member-list-area').style.display = isMemberArea ? 'block' : 'none';
        document.getElementById('modal-input').value = "";
        document.getElementById('modal-confirm').innerText = btnText;
        document.getElementById('custom-modal').style.display = 'flex';
        modalCB = callback;
    }
    function closeM() { document.getElementById('custom-modal').style.display = 'none'; }
    document.getElementById('modal-confirm').onclick = () => { if(modalCB) modalCB(document.getElementById('modal-input').value); closeM(); };

    function openLogoutM() { openM("Logout", "Keluar dari sesi ini?", "", false, "YA, KELUAR", () => location.reload()); }

    function doLogin() {
        const u = document.getElementById('login-user').value.trim().toLowerCase();
        const p = document.getElementById('login-pass').value.trim();
        db.ref('users/'+u).once('value', s => {
            if(s.exists() && s.val().password === p) { me = s.val(); startApp(); }
            else openM("Gagal", "User/Pass salah", "", false, "COBA LAGI", null);
        });
    }

    function startApp() {
        document.getElementById('auth-gate').style.display = 'none';
        document.getElementById('my-name').innerText = me.username;
        updateMyAv();
        db.ref('presence/'+me.username).set('online');
        db.ref('presence/'+me.username).onDisconnect().set('offline');
        loadChatList();
    }

    function triggerGallery() { document.getElementById('file-helper').click(); }
    function handleFileSelect(e) {
        const file = e.target.files[0]; if(!file) return;
        const r = new FileReader();
        r.onload = (ex) => { db.ref('users/'+me.username+'/av').set(ex.target.result); me.av = ex.target.result; updateMyAv(); };
        r.readAsDataURL(file);
    }
    function updateMyAv() { document.getElementById('my-av').innerHTML = me.av ? `<img src="${me.av}" class="w-full h-full object-cover">` : me.username[0].toUpperCase(); }

    // --- HAPUS KONTAK/CHAT LIST ---
    function deleteContact(key) {
        openM("Hapus Kontak", "Hapus "+key+" dari daftar Anda?", "", false, "HAPUS", () => {
            db.ref('mylists/'+me.username+'/'+key).remove();
        });
    }

    function loadChatList() {
        db.ref('mylists/'+me.username).on('value', snap => {
            const list = document.getElementById('chat-list'); list.innerHTML = "";
            snap.forEach(item => {
                const key = item.key; const isG = item.val().isGroup;
                const div = document.createElement('div');
                div.className = "p-5 flex items-center gap-4 border-b border-white/5 active:bg-white/5 relative";
                div.innerHTML = `
                    <div class="avatar" id="l-av-${key}">${isG?'G':key[0].toUpperCase()}</div>
                    <div class="flex-1" onclick="openChat('${key}', ${isG})">
                        <h4 class="font-bold text-sm uppercase" id="l-name-${key}">${key}</h4>
                        <p class="text-[9px] text-gray-500" id="l-st-${key}">${isG?'Group Chat':'Offline'}</p>
                    </div>
                    <button onclick="deleteContact('${key}')" class="text-[10px] text-red-900 opacity-40 p-2">🗑️</button>`;
                list.appendChild(div);
                if(isG) db.ref('groups/'+key+'/name').on('value', s => { if(s.val()) document.getElementById('l-name-'+key).innerText = s.val(); });
                else {
                    db.ref('presence/'+key).on('value', s => { const st = s.val() || 'offline'; const el = document.getElementById('l-st-'+key); if(el){el.innerText=st; el.style.color=st==='online'?'#34c759':'';}});
                    db.ref('users/'+key+'/av').on('value', s => { if(s.val()) document.getElementById('l-av-'+key).innerHTML = `<img src="${s.val()}" class="w-full h-full object-cover">`; });
                }
            });
        });
    }

    // --- HAPUS PESAN ---
    function deleteMessage(mid) {
        const isG = curT.startsWith("group_");
        const rid = isG ? curT : [me.username, curT].sort().join("_");
        openM("Hapus Pesan", "Hapus pesan ini untuk semua orang?", "", false, "HAPUS", () => {
            db.ref('chats/'+rid+'/'+mid).remove();
        });
    }

    function doSend(type, val) {
        const input = document.getElementById('msg-in'); let txt = val || input.value.trim(); if(!txt) return;
        if(txt.startsWith("/saran ")) {
            const saran = txt.replace("/saran ", "");
            const adminRid = [me.username, "adminresmi"].sort().join("_");
            db.ref('chats/'+adminRid).push({s: me.username, t: "📩 SARAN: " + saran, type: 'text', time: Date.now()});
            db.ref('mylists/adminresmi/'+me.username).set({isGroup:false});
            db.ref('mylists/'+me.username+'/adminresmi').set({isGroup:false});
            openM("Sukses", "Saran terkirim ke Adminresmi", "", false, "OK", null);
            input.value = ""; return;
        }
        const isG = curT.startsWith("group_");
        const rid = isG ? curT : [me.username, curT].sort().join("_");
        db.ref('chats/'+rid).push({s: me.username, t: txt, type: type, time: Date.now()});
        if(txt.toLowerCase() === "/kodeblue") {
            setTimeout(() => { db.ref('chats/'+rid).push({s: "RVI BOT", t: "✅ VERIFIKASI: Akun anda dalam peninjauan Centang Biru BKI.", type: 'text', time: Date.now()}); }, 500);
        }
        if(!isG) db.ref('mylists/'+curT+'/'+me.username).set({isGroup:false});
        input.value = "";
    }

    function openChat(t, isG) {
        if(chatRef) chatRef.off(); curT = t;
        document.getElementById('chat-screen').classList.add('screen-active');
        document.getElementById('group-ctrl').style.display = isG ? 'flex' : 'none';
        if(isG) db.ref('groups/'+t+'/name').on('value', s => { document.getElementById('r-name').innerText = s.val() || t; });
        else document.getElementById('r-name').innerText = t;

        const rid = isG ? t : [me.username, t].sort().join("_");
        chatRef = db.ref('chats/'+rid);
        chatRef.on('value', snap => {
            const cv = document.getElementById('canvas'); cv.innerHTML = "";
            snap.forEach(m => {
                const d = m.val(); const isMe = d.s === me.username;
                const b = document.createElement('div'); 
                b.className = `bubble ${isMe?'b-me':'b-them'}`;
                b.onclick = () => { if(isMe) deleteMessage(m.key); };
                let c = `<p class="text-[8px] font-black opacity-30 mb-1 uppercase">${d.s}</p>`;
                if(d.type==='image') c += `<img src="${d.t}" class="img-msg">`;
                else if(d.type==='file') c += `<div class="bg-black/20 p-3 rounded-xl text-[10px]">📁 <a href="${d.t}" target="_blank" class="text-blue-400 underline">OPEN FILE</a></div>`;
                else c += `<p>${d.t}</p>`;
                b.innerHTML = c; cv.appendChild(b);
            });
            cv.scrollTo(0, cv.scrollHeight);
        });
    }

    // --- GRUP & LAINNYA ---
    async function openGroupInfo() {
        if(!curT.startsWith("group_")) return;
        const s = await db.ref('groups/'+curT).once('value');
        const g = s.val();
        const mems = Object.keys(g.members).map(m => `<div class="bg-white/5 p-3 rounded-2xl mb-2 flex justify-between items-center"><span class="text-[10px] font-black uppercase">👤 ${m}</span> ${m===g.owner?'<span class="text-[8px] bg-blue-600 px-2 py-1 rounded-lg">OWNER</span>':''}</div>`).join("");
        document.getElementById('member-list-area').innerHTML = mems;
        openM("Info Grup", g.owner===me.username ? "Ganti nama grup:" : "Anggota:", "Nama baru...", g.owner===me.username, "SIMPAN", n => { if(n) db.ref('groups/'+curT+'/name').set(n); }, true);
    }
    function openCreateGroup() { openM("Buat Grup", "Nama grup baru", "Nama...", true, "BUAT", n => { if(!n) return; const gid="group_"+Date.now(); db.ref('groups/'+gid).set({id:gid,name:n,owner:me.username,members:{[me.username]:true}}); db.ref('mylists/'+me.username+'/'+gid).set({isGroup:true}); }); }
    function openInvite() { openM("Undang", "Username", "ID...", true, "UNDANG", u => { const t=u.toLowerCase().trim(); db.ref('groups/'+curT+'/members/'+t).set(true); db.ref('mylists/'+t+'/'+curT).set({isGroup:true}); }); }
    function openKick() { openM("Kick", "Ketik username", "ID...", true, "KICK", u => { const t=u.toLowerCase().trim(); db.ref('groups/'+curT+'/members/'+t).remove(); db.ref('mylists/'+t+'/'+curT).remove(); }); }
    function openSearch() { openM("Cari", "ID User", "Username...", true, "CHAT", u => { const t=u.toLowerCase().trim(); db.ref('users/'+t).once('value', s => { if(s.exists()){ db.ref('mylists/'+me.username+'/'+t).set({isGroup:false}); openChat(t, false); }}); }); }
    function openMedia(type) { openM("Kirim " + type, "Masukkan URL Link", "https://...", true, "KIRIM", url => { if(url) doSend(type, url); }); }
    function closeChat() { document.getElementById('chat-screen').classList.remove('screen-active'); }
</script>
</body>
</html>
