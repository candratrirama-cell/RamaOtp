<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RMAIL PRO v380 - PT BKI</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #007aff; --bg: #010409; --panel: #0d1117; --border: rgba(255,255,255,0.08); }
        body { background: var(--bg); color: #e6edf3; font-family: 'Plus Jakarta Sans', sans-serif; height: 100dvh; overflow: hidden; margin:0; }
        .screen { position: fixed; inset: 0; background: var(--bg); transform: translateX(100%); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 100; }
        .screen-active { transform: translateX(0); }
        .glass { background: rgba(13, 17, 23, 0.8); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(12px); }
        .modal-card { background: var(--panel); border: 1px solid var(--border); width: 100%; max-width: 320px; border-radius: 32px; padding: 28px; text-align: center; }
        .avatar { width: 50px; height: 50px; border-radius: 18px; object-fit: cover; background: #161b22; display: flex; align-items: center; justify-content: center; font-weight: 800; border: 1px solid var(--border); flex-shrink: 0; overflow: hidden; position: relative; }
        .online-dot { position: absolute; bottom: -2px; right: -2px; width: 12px; height: 12px; background: #34c759; border: 3px solid var(--bg); border-radius: 50%; }
        .bubble { max-width: 80%; padding: 12px 16px; border-radius: 20px; font-size: 14px; margin-bottom: 4px; line-height: 1.4; cursor: pointer; }
        .b-me { background: var(--accent); align-self: flex-end; border-bottom-right-radius: 4px; }
        .b-them { background: #21262d; align-self: flex-start; border-bottom-left-radius: 4px; }
        .unread-badge { background: #ff3b30; color: white; font-size: 10px; font-weight: 900; padding: 2px 8px; border-radius: 10px; min-width: 20px; }
        .v-badge { width: 14px; height: 14px; color: #00a3ff; display: inline-block; margin-left: 4px; vertical-align: middle; }
    </style>
</head>
<body>

<div id="modal" class="modal-overlay">
    <div class="modal-card">
        <h3 id="m-title" class="text-white font-black uppercase text-lg mb-1"></h3>
        <p id="m-desc" class="text-gray-500 text-[10px] font-bold uppercase mb-6 tracking-widest"></p>
        <div id="m-input-area"><input type="text" id="m-input" class="w-full bg-[#010409] p-4 rounded-2xl outline-none text-white font-bold border border-white/5 mb-6"></div>
        <div class="flex gap-3">
            <button onclick="closeM()" class="flex-1 text-gray-500 font-bold text-[11px] uppercase">Batal</button>
            <button id="m-confirm" class="flex-1 py-4 bg-blue-600 rounded-2xl text-white font-black text-[11px] uppercase">OK</button>
        </div>
    </div>
</div>

<div class="flex flex-col h-screen">
    <header class="glass p-6 pt-12 flex justify-between items-center">
        <div><h1 class="text-2xl font-black tracking-tighter">Rmail.</h1><p class="text-[9px] font-bold text-blue-500 uppercase tracking-widest">PT BKI v380</p></div>
        <div class="flex gap-3">
            <button onclick="searchNode()" class="w-10 h-10 bg-[#161b22] rounded-xl flex items-center justify-center">🔍</button>
            <button onclick="newGroup()" class="w-10 h-10 bg-[#161b22] rounded-xl flex items-center justify-center text-blue-500 font-black">G+</button>
            <button onclick="openProfile()" id="nav-av" class="avatar !w-10 !h-10 border-blue-600"></button>
        </div>
    </header>
    <div id="chat-list" class="flex-1 overflow-y-auto"></div>
</div>

<div id="chat-screen" class="screen flex flex-col">
    <header class="glass p-4 pt-10 flex items-center gap-4">
        <button onclick="closeChat()" class="p-2 text-2xl">←</button>
        <div id="r-av" class="avatar !w-10 !h-10"></div>
        <div class="flex-1">
            <h3 id="r-name" class="font-bold text-sm uppercase flex items-center"></h3>
            <p id="r-presence" class="text-[9px] font-black uppercase tracking-widest text-blue-500"></p>
        </div>
    </header>
    <div id="canvas" class="flex-1 overflow-y-auto p-5 flex flex-col"></div>
    <div class="p-4 bg-[#0d1117] flex gap-3 pb-10">
        <input type="text" id="msg-in" oninput="handleTyping()" placeholder="Ketik..." class="flex-1 bg-[#161b22] p-4 rounded-2xl outline-none border border-white/5 text-sm">
        <button onclick="doSend()" class="w-14 h-14 bg-blue-600 rounded-2xl flex items-center justify-center">➤</button>
    </div>
</div>

<div id="auth-screen" class="fixed inset-0 z-[5000] bg-[#010409] flex flex-col items-center justify-center p-10">
    <h1 class="text-7xl font-black tracking-tighter text-white">RM.</h1>
    <p class="text-blue-500 font-bold text-[9px] uppercase tracking-[0.5em] mt-2 mb-12">PT BANGGA KARYA INDONESIA</p>
    <div class="w-full max-w-xs space-y-3">
        <input type="text" id="u-in" placeholder="Username" class="w-full p-4 bg-[#0d1117] rounded-2xl border border-white/5 text-white font-bold text-center">
        <input type="password" id="p-in" placeholder="Password" class="w-full p-4 bg-[#0d1117] rounded-2xl border border-white/5 text-white font-bold text-center">
        <button onclick="doLogin()" class="w-full bg-blue-600 py-4 rounded-2xl font-black text-white uppercase tracking-widest">Dashboard Masuk</button>
    </div>
</div>

<div id="p-screen" class="screen p-10 pt-16 flex flex-col items-center">
    <div class="w-full flex justify-between mb-10"><button onclick="closeP()" class="text-gray-500 text-[10px] font-bold uppercase">Kembali</button><button onclick="saveP()" class="bg-blue-600 px-6 py-2 rounded-xl text-white font-black text-[10px] uppercase">Update</button></div>
    <div class="relative mb-8"><img id="p-img-display" src="" class="w-32 h-32 rounded-[40px] border-2 border-blue-600 bg-[#161b22] object-cover"><button onclick="document.getElementById('file-input').click()" class="absolute -bottom-2 -right-2 bg-blue-600 p-3 rounded-2xl border-4 border-[#010409]">📸</button><input type="file" id="file-input" class="hidden" accept="image/*" onchange="processFile(this)"></div>
    <h2 id="p-username-display" class="text-2xl font-black uppercase text-white"></h2>
    <button onclick="logout()" class="w-full py-4 text-red-500 font-black text-[10px] border border-red-500/10 rounded-2xl uppercase mt-10">Logout</button>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDwT0SeUkimENH3yTg2jzf_atlyFfh3_nU",
        authDomain: "rmail-68719.firebaseapp.com",
        databaseURL: "https://rmail-68719-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "rmail-68719",
        storageBucket: "rmail-68719.firebasestorage.app",
        messagingSenderId: "408858505940",
        appId: "1:408858505940:web:b7a594adfd4be9725d8141"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let me = null, curT = "", isG = false, tempPic = "", typingTimeout, chatRef = null;
    const V_BADGE = `<svg class="v-badge" viewBox="0 0 24 24" fill="currentColor"><path d="M23 12l-2.44-2.79.34-3.69-3.61-.82-1.89-3.2L12 2.96 8.6 1.5 6.71 4.7 3.1 5.52l.34 3.69L1 12l2.44 2.79-.34 3.69 3.61.82 1.89 3.2L12 21.04l3.4 1.46 1.89-3.2 3.61-.82-.34-3.69L23 12zm-12.91 4.72l-3.8-3.81 1.48-1.48 2.32 2.33 5.85-5.87 1.48 1.48-7.33 7.35z"/></svg>`;

    function openM(t, d, p, hi, bt, cb) {
        document.getElementById('m-title').innerText = t; document.getElementById('m-desc').innerText = d;
        document.getElementById('m-input-area').style.display = hi ? 'block' : 'none';
        const cBtn = document.getElementById('m-confirm'); cBtn.innerText = bt || "OK";
        document.getElementById('modal').style.display = 'flex';
        cBtn.onclick = () => { cb(document.getElementById('m-input').value); closeM(); };
    }
    function closeM() { document.getElementById('modal').style.display = 'none'; }

    async function doLogin() {
        const u = document.getElementById('u-in').value.trim().toLowerCase();
        const p = document.getElementById('p-in').value; if(!u || !p) return;
        const s = await db.ref('users/'+u).once('value');
        if(s.exists() && s.val().password === p) { me = s.val(); run(); }
        else if(!s.exists()) { me = { username:u, password:p, av:"", isVerified:false }; await db.ref('users/'+u).set(me); run(); }
        else openM("Gagal", "Password salah", "", false, "ULANGI", ()=>{});
    }

    function run() {
        localStorage.setItem('rm_pro_v380', JSON.stringify(me));
        document.getElementById('auth-screen').classList.add('hidden');
        db.ref('presence/'+me.username).set({ status: 'online', typing: false });
        db.ref('presence/'+me.username).onDisconnect().set({ status: 'offline', typing: false });
        init();
    }

    function init() {
        db.ref('users/'+me.username).on('value', s => { 
            me = s.val(); 
            document.getElementById('nav-av').innerHTML = me.av ? `<img src="${me.av}" class="w-full h-full object-cover">` : me.username[0].toUpperCase();
        });
        loadList();
    }

    function loadList() {
        db.ref('mylists/'+me.username).on('value', snap => {
            const list = document.getElementById('chat-list'); list.innerHTML = "";
            snap.forEach(item => {
                const key = item.key; const isGroup = item.val().isGroup;
                const div = document.createElement('div');
                div.className = "p-5 flex items-center gap-4 border-b border-white/5";
                div.innerHTML = `<div class="avatar" id="av-${key}"></div><div class="flex-1" onclick="openChat('${key}',${isGroup})"><div class="flex justify-between items-center"><h4 class="font-bold text-sm uppercase flex items-center" id="name-${key}">${key}</h4><div id="unread-${key}" class="hidden unread-badge">0</div></div><p id="pres-${key}" class="text-[9px] font-bold uppercase text-gray-500">Offline</p></div><button onclick="delContact('${key}')" class="text-red-500 font-black text-[10px] px-2">DEL</button>`;
                list.appendChild(div);
                if(!isGroup) {
                    db.ref('users/'+key).on('value', u => {
                        const ud = u.val(); if(!ud) return;
                        document.getElementById('av-'+key).innerHTML = (ud.av ? `<img src="${ud.av}" class="w-full h-full object-cover">` : key[0].toUpperCase()) + (ud.status === 'online' ? '<div class="online-dot"></div>' : '');
                        document.getElementById('name-'+key).innerHTML = key + (ud.isVerified?V_BADGE:'');
                    });
                    db.ref('presence/'+key).on('value', ps => {
                        const p = ps.val(); const el = document.getElementById('pres-'+key);
                        if(p) { el.innerText = p.typing === me.username ? "Mengetik..." : p.status; el.className = p.status === 'online' ? "text-blue-500 text-[9px] font-black uppercase" : "text-gray-500 text-[9px] font-bold uppercase"; }
                    });
                } else {
                    db.ref('groups/'+key).on('value', g => { if(!g.val()) return; document.getElementById('name-'+key).innerText = g.val().name; document.getElementById('av-'+key).innerHTML = `<div class="w-full h-full bg-blue-600 flex items-center justify-center text-white">#</div>`; });
                }
                const rid = isGroup ? key : [me.username, key].sort().join("_");
                db.ref('chats/'+rid).on('value', cs => {
                    let u = 0; cs.forEach(m => { if(m.val().s !== me.username && !m.val().read) u++; });
                    const b = document.getElementById('unread-'+key); if(u > 0) { b.innerText = u; b.classList.remove('hidden'); } else b.classList.add('hidden');
                });
            });
        });
    }

    function openChat(t, gMode) {
        if(chatRef) chatRef.off();
        curT = t; isG = gMode;
        document.getElementById('chat-screen').classList.add('screen-active');
        const rid = isG ? t : [me.username, t].sort().join("_");
        
        chatRef = db.ref('chats/'+rid);
        chatRef.on('value', snap => {
            const cv = document.getElementById('canvas'); cv.innerHTML = "";
            snap.forEach(m => {
                const msg = m.val(); const isMe = msg.s === me.username;
                if(!isMe && !msg.read) db.ref('chats/'+rid+'/'+m.key).update({read: true});
                const b = document.createElement('div');
                b.className = `bubble ${isMe?'b-me':'b-them'}`;
                b.innerHTML = `<p class="text-[10px] opacity-50 font-black mb-1">${msg.s.toUpperCase()}</p><p>${msg.t}</p><div class="text-[8px] mt-1 opacity-50 font-bold text-right">${isMe ? (msg.read ? '✓✓' : '✓') : ''}</div>`;
                b.onclick = () => openM("Hapus", "Hapus pesan ini?", "", false, "HAPUS", () => db.ref('chats/'+rid+'/'+m.key).remove());
                cv.appendChild(b);
            });
            cv.scrollTo(0, cv.scrollHeight);
        });

        if(!isG) {
            db.ref('users/'+t).on('value', s => { const ud = s.val(); document.getElementById('r-name').innerHTML = t + (ud?.isVerified?V_BADGE:''); document.getElementById('r-av').innerHTML = (ud?.av ? `<img src="${ud.av}" class="w-full h-full object-cover">` : t[0].toUpperCase()); });
            db.ref('presence/'+t).on('value', ps => { document.getElementById('r-presence').innerText = ps.val()?.typing === me.username ? "Sedang Mengetik..." : (ps.val()?.status || "Offline"); });
        } else {
            db.ref('groups/'+t).on('value', s => { document.getElementById('r-name').innerText = s.val()?.name; document.getElementById('r-presence').innerText = "GROUP MODE"; });
        }
    }

    async function doSend() {
        const i = document.getElementById('msg-in'); const txt = i.value.trim(); if(!txt) return; i.value = "";
        const rid = isG ? curT : [me.username, curT].sort().join("_");
        if(!isG) db.ref('mylists/'+curT+'/'+me.username).set({ isGroup: false });
        
        if(!isG && curT === 'rvi' && txt.toLowerCase() === '/kodeblue'){
            await db.ref('users/'+me.username).update({isVerified: true});
            db.ref('chats/'+rid).push({ s: 'rvi', t: "BKI VERIFIED: Centang biru aktif!" }); return;
        }
        await db.ref('chats/'+rid).push({ s: me.username, t: txt, read: false });
        db.ref('presence/'+me.username).update({ typing: false });
    }

    function searchNode() {
        openM("Cari User", "Masukkan ID", "ID...", true, "TAMBAH", val => {
            const t = val.toLowerCase().trim(); if(!t) return;
            db.ref('users/'+t).once('value', s => {
                if(s.exists()){ db.ref('mylists/'+me.username+'/'+t).set({isGroup:false}); openChat(t,false); }
                else openM("Gagal", "Username belum terdaftar!", "", false, "OK", ()=>{});
            });
        });
    }

    function handleTyping() {
        db.ref('presence/'+me.username).update({ typing: curT });
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => db.ref('presence/'+me.username).update({ typing: false }), 2000);
    }

    function processFile(i) { if (i.files && i.files[0]) { const r = new FileReader(); r.onload = e => { tempPic = e.target.result; document.getElementById('p-img-display').src = tempPic; }; r.readAsDataURL(i.files[0]); } }
    async function saveP() { if(!tempPic) return; await db.ref('users/'+me.username).update({ av: tempPic }); openM("Sukses", "Foto Terupdate!", "", false, "OK", () => closeP()); }
    function delContact(id) { openM("Hapus", `Hapus ${id}?`, "", false, "HAPUS", () => db.ref('mylists/'+me.username+'/'+id).remove()); }
    function openProfile() { document.getElementById('p-username-display').innerText = "@" + me.username; document.getElementById('p-img-display').src = me.av || "https://ui-avatars.com/api/?name="+me.username; document.getElementById('p-screen').classList.add('screen-active'); }
    function closeP() { document.getElementById('p-screen').classList.remove('screen-active'); }
    function closeChat() { document.getElementById('chat-screen').classList.remove('screen-active'); if(chatRef) chatRef.off(); }
    function logout() { db.ref('presence/'+me.username).set({status:'offline'}); localStorage.clear(); location.reload(); }
    function newGroup() { openM("Grup", "Nama Grup", "Nama...", true, "BUAT", val => { if(!val) return; const gid = Math.floor(10000 + Math.random() * 90000).toString(); db.ref('groups/'+gid).set({ name: val, gid: gid }); db.ref('mylists/'+me.username+'/'+gid).set({ isGroup: true }); }); }

    window.onload = () => { const s = localStorage.getItem('rm_pro_v380'); if(s) { me = JSON.parse(s); run(); } };
</script>
</body>
</html>
