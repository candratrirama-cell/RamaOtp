<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RMAIL RVI v2100 - PT Bangga Karya Indonesia</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #fe2c55; --bg: #000; --card: #161616; --border: rgba(255,255,255,0.08); }
        body { background: var(--bg); color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; height: 100dvh; margin: 0; overflow: hidden; }
        .scroll-area { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 120px; }
        .v-blue { display: inline-flex; align-items: center; justify-content: center; background: #0070f3; color: white; width: 14px; height: 14px; border-radius: 50%; font-size: 8px; margin-left: 5px; border: 1.5px solid black; box-shadow: 0 0 10px #0070f3; }
        .v-red { display: inline-flex; align-items: center; justify-content: center; background: #fe2c55; color: white; width: 14px; height: 14px; border-radius: 50%; font-size: 8px; margin-left: 5px; border: 1.5px solid black; box-shadow: 0 0 10px #fe2c55; }
        .n-badge { background: #fe2c55; color: white; min-width: 20px; height: 20px; border-radius: 50%; font-size: 10px; font-weight: 900; display: flex; align-items: center; justify-content: center; position: absolute; right: 15px; top: 50%; transform: translateY(-50%); z-index: 10; }
        .screen { position: fixed; inset: 0; background: var(--bg); transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1000; display: flex; flex-direction: column; }
        .screen-active { transform: translateX(0); }
        .avatar { width: 50px; height: 50px; border-radius: 18px; background: #222; display: flex; align-items: center; justify-content: center; font-weight: 800; border: 1px solid var(--border); overflow: hidden; flex-shrink: 0; position: relative; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; position: absolute; }
        .bubble { max-width: 80%; padding: 10px 14px; border-radius: 20px; font-size: 14px; margin-bottom: 4px; position: relative; word-wrap: break-word; display: flex; flex-direction: column; }
        .b-me { background: #0070f3; align-self: flex-end; border-bottom-right-radius: 4px; }
        .b-them { background: var(--card); align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid var(--border); }
        .msg-time { font-size: 8px; opacity: 0.6; align-self: flex-end; margin-top: 4px; font-weight: bold; }
        .glass-nav { background: rgba(0,0,0,0.92); backdrop-filter: blur(25px); border-bottom: 1px solid var(--border); z-index: 50; }
    </style>
</head>
<body>

<div id="gate" class="fixed inset-0 z-[9999] bg-black flex flex-col items-center justify-center p-10">
    <div class="w-20 h-20 bg-gradient-to-tr from-[#fe2c55] to-[#0070f3] rounded-[24px] mb-8 flex items-center justify-center font-black text-white text-3xl shadow-2xl">R</div>
    <div class="w-full max-w-xs space-y-3">
        <input type="text" id="ul" placeholder="USERNAME" class="w-full p-4 bg-[#111] border border-white/5 rounded-xl outline-none text-white text-center font-bold uppercase">
        <input type="password" id="pl" placeholder="PASSWORD" class="w-full p-4 bg-[#111] border border-white/5 rounded-xl outline-none text-white text-center font-bold">
        <button onclick="doLogin()" class="w-full bg-[#fe2c55] py-4 rounded-xl font-black text-white uppercase text-[10px] tracking-widest shadow-lg active:scale-95 transition-all">Connect System</button>
    </div>
</div>

<div class="flex flex-col h-screen">
    <header class="p-6 pt-14 flex justify-between items-center glass-nav">
        <div class="flex items-center gap-3">
            <div id="my-av" onclick="document.getElementById('f-av').click()" class="avatar cursor-pointer">?</div>
            <div>
                <div class="flex items-center"><h1 id="my-name" class="text-xs font-black uppercase">...</h1><span id="my-v-badge"></span></div>
                <button onclick="doLogout()" class="text-[7px] font-black text-red-500 uppercase italic">Power Off</button>
            </div>
        </div>
        <div class="flex gap-2">
            <button onclick="opM('Grup Baru','Nama','',true,'Buat',g=>createG(g))" class="bg-white/5 p-3 rounded-xl">👥</button>
            <button onclick="opM('Cari User','Username','',true,'Cari',u=>srcU(u))" class="bg-white/5 p-3 rounded-xl">🔍</button>
        </div>
    </header>
    <div id="list" class="scroll-area p-4 space-y-2"></div>
</div>

<div id="room" class="screen">
    <header class="p-4 pt-14 flex items-center gap-3 glass-nav">
        <button onclick="exChat()" class="p-2 text-xl">←</button>
        <div id="r-av" class="avatar !w-10 !h-10"></div>
        <div class="flex-1">
            <div class="flex items-center"><h3 id="r-name" class="font-bold text-xs uppercase truncate">...</h3><span id="r-v-badge"></span></div>
            <p id="r-status" class="text-[6px] font-black text-green-500 uppercase">Secure RVI Chat</p>
        </div>
        <div id="g-tools" class="hidden flex gap-2">
            <button onclick="viewGroup()" class="p-2 bg-white/10 rounded-lg text-[8px] font-bold">INFO</button>
            <button onclick="inviteM()" class="p-2 bg-white/10 rounded-lg text-[8px] font-bold">+</button>
        </div>
        <button onclick="delContact()" id="btn-del-c" class="p-2 text-red-500">🗑️</button>
    </header>
    <div id="canvas" class="scroll-area p-5 flex flex-col gap-2"></div>
    <div class="p-4 glass-nav flex flex-col gap-2 pb-10">
        <div class="flex items-center gap-2">
            <button onclick="document.getElementById('f-msg').click()" class="bg-white/5 p-4 rounded-xl">📎</button>
            <input type="text" id="mi" placeholder="Pesan..." class="flex-1 bg-white/10 p-4 rounded-2xl outline-none text-sm text-white">
            <button onclick="snd()" class="w-12 h-12 bg-[#fe2c55] rounded-xl flex items-center justify-center font-black">↑</button>
        </div>
    </div>
</div>

<div id="modal" class="fixed inset-0 z-[9999] bg-black/95 hidden items-center justify-center p-8 backdrop-blur-md">
    <div class="bg-white text-black p-8 rounded-[30px] w-full max-w-xs text-center">
        <h3 id="mt" class="font-black uppercase text-[10px] mb-4 text-gray-400"></h3>
        <div id="mw"><input type="text" id="mv" class="w-full bg-gray-100 p-4 rounded-xl outline-none mb-4 font-bold text-center uppercase"></div>
        <div id="custom-area" class="max-h-60 overflow-y-auto mb-4 text-left"></div>
        <div class="flex flex-col gap-2">
            <div class="flex gap-2">
                <button onclick="clsM()" class="flex-1 font-bold text-[9px] uppercase border p-4 rounded-xl">Batal</button>
                <button id="mok" class="flex-1 bg-black text-white py-4 rounded-xl font-black text-[9px] uppercase">Ok</button>
            </div>
            <button id="btn-del-g" class="hidden w-full bg-red-600 text-white py-4 rounded-xl font-black text-[9px] uppercase mt-2">Hapus Grup</button>
        </div>
    </div>
</div>

<input type="file" id="f-av" class="hidden" onchange="upFile(event, 'av')">
<input type="file" id="f-msg" class="hidden" onchange="upFile(event, 'msg')">

<script>
    const cfg = { databaseURL: "https://rmail-68719-default-rtdb.asia-southeast1.firebasedatabase.app" };
    firebase.initializeApp(cfg);
    const db = firebase.database();
    let me = null, activeRid = "", activeTarget = "", isG = false, sub = null, mCB = null, counts = {};

    function opM(t,d,p,h,b,c) { 
        document.getElementById('mt').innerText=t; 
        document.getElementById('mv').placeholder=d; 
        document.getElementById('mv').value=p;
        document.getElementById('mw').style.display=h?'block':'none'; 
        document.getElementById('custom-area').innerHTML = "";
        document.getElementById('btn-del-g').className = "hidden";
        document.getElementById('modal').style.display='flex'; 
        mCB=c; 
    }
    function clsM() { document.getElementById('modal').style.display='none'; }
    document.getElementById('mok').onclick=()=>{ if(mCB) mCB(document.getElementById('mv').value.trim()); clsM(); };

    function doLogin() {
        const u = document.getElementById('ul').value.trim().toLowerCase();
        const p = document.getElementById('pl').value.trim();
        if(!u || !p) return;
        db.ref('users/rai').update({ username: 'rai', verify: 'red', password: '999' });
        db.ref('users/'+u).once('value', s => {
            if(s.exists()) {
                if(s.val().password === p) { me = s.val(); loginSuccess(u,p); }
                else alert("Password Salah!");
            } else {
                const newUser = { username: u, password: p, verify: 'none', av: "" };
                db.ref('users/'+u).set(newUser).then(() => { me = newUser; loginSuccess(u,p); });
            }
        });
    }

    function loginSuccess(u,p) { localStorage.setItem('rmu',u); localStorage.setItem('rmp',p); init(); }
    function doLogout() { localStorage.clear(); location.reload(); }

    function init() {
        document.getElementById('gate').style.display = 'none';
        db.ref('users/'+me.username).on('value', s => { 
            me = s.val(); 
            document.getElementById('my-name').innerText = me.username;
            const b = document.getElementById('my-v-badge');
            b.className = me.verify === 'blue' ? 'v-blue' : (me.verify === 'red' ? 'v-red' : '');
            b.innerText = b.className ? '✓' : '';
            if(me.av) document.getElementById('my-av').innerHTML = `<img src="${me.av}">`;
        });
        loadList();
    }

    function loadList() {
        db.ref('mylists/'+me.username).on('value', snap => {
            const list = document.getElementById('list'); list.innerHTML = "";
            snap.forEach(it => {
                const t = it.key; const d = it.val();
                const rid = d.isG ? t : [me.username, t].sort().join("_");
                const div = document.createElement('div');
                div.className = "p-4 flex items-center gap-4 bg-white/5 rounded-[22px] border border-white/5 mb-2 relative active:scale-95 transition-all";
                div.innerHTML = `
                    <div class="avatar" id="lav-${t}">${d.isG?'G':t[0].toUpperCase()}</div>
                    <div class="flex-1" onclick="openC('${t}', ${d.isG})">
                        <div class="flex justify-between items-center">
                            <div class="flex items-center"><h4 class="font-extrabold text-xs uppercase">${d.isG?d.name:t}</h4><span id="lv-${t}"></span></div>
                            <div id="nb-${t}" class="n-badge hidden">0</div>
                        </div>
                        <p id="lp-${t}" class="text-[7px] opacity-30 truncate uppercase font-black">RVI Active</p>
                    </div>`;
                list.appendChild(div);

                db.ref('chats/'+rid).limitToLast(1).on('child_added', s => {
                    const m = s.val();
                    if(m.s !== me.username) {
                        document.getElementById('lp-'+t).innerText = m.s + ": " + (m.type==='file'?'📎 Media':m.t);
                        if(activeRid !== rid) {
                            counts[t] = (counts[t] || 0) + 1;
                            const badge = document.getElementById('nb-'+t);
                            if(badge) { badge.innerText = counts[t]; badge.classList.remove('hidden'); }
                        }
                    }
                });

                if(!d.isG) db.ref('users/'+t).on('value', s => {
                    const u = s.val(); if(!u) return;
                    const b = document.getElementById('lv-'+t);
                    if(u.verify==='red') b.className='v-red', b.innerText='✓';
                    else if(u.verify==='blue') b.className='v-blue', b.innerText='✓';
                    if(u.av) document.getElementById(`lav-${t}`).innerHTML = `<img src="${u.av}">`;
                });
            });
        });
    }

    function formatTime(ts) {
        const d = new Date(ts);
        return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
    }

    function openC(t, g) {
        if(sub) sub.off(); activeTarget = t; isG = g;
        activeRid = g ? t : [me.username, t].sort().join("_");
        counts[t] = 0; document.getElementById('nb-'+t)?.classList.add('hidden');
        document.getElementById('room').classList.add('screen-active');
        
        document.getElementById('r-av').innerHTML = g ? 'G' : t[0].toUpperCase();
        const b = document.getElementById('r-v-badge'); b.className = ""; b.innerText = "";
        
        if(g) {
            db.ref('groups/'+activeRid).once('value', s => { if(s.exists()) document.getElementById('r-name').innerText = s.val().name; });
        } else {
            document.getElementById('r-name').innerText = t;
            db.ref('users/'+t).once('value', s => {
                const u = s.val(); if(u?.av) document.getElementById('r-av').innerHTML = `<img src="${u.av}">`;
                if(u?.verify === 'red') b.className = 'v-red', b.innerText = '✓';
                if(u?.verify === 'blue') b.className = 'v-blue', b.innerText = '✓';
            });
        }

        sub = db.ref('chats/'+activeRid);
        sub.on('value', snap => {
            const canvas = document.getElementById('canvas'); canvas.innerHTML = "";
            snap.forEach(m => {
                const d = m.val(); const key = m.key;
                const div = document.createElement('div');
                div.className = `bubble ${d.s === me.username ? 'b-me' : 'b-them'}`;
                div.onclick = () => { if(confirm("Hapus pesan?")) db.ref('chats/'+activeRid+'/'+key).remove(); };
                
                let body = d.type === 'file' ? `<img src="${d.file}" class="rounded-xl w-full">` : d.t;
                let time = formatTime(d.time || Date.now());
                
                div.innerHTML = `
                    <p class="text-[6px] font-black opacity-40 mb-1 uppercase">${d.s}</p>
                    <div class="text-sm">${body}</div>
                    <span class="msg-time">${time}</span>
                `;
                canvas.appendChild(div);
            });
            canvas.scrollTo(0, 1000000);
        });
    }

    async function snd(fileData = null) {
        const i = document.getElementById('mi'); const t = i.value.trim();
        if(!t && !fileData) return;
        const msg = { s: me.username, t: t, time: Date.now(), type: fileData?'file':'text', file: fileData||'' };
        db.ref('chats/'+activeRid).push(msg);
        if(!isG) {
            db.ref('mylists/'+activeTarget+'/'+me.username).update({ last: Date.now(), isG: false });
            db.ref('mylists/'+me.username+'/'+activeTarget).update({ last: Date.now(), isG: false });
            if(activeTarget.toLowerCase() === 'rai') handleRAI(t);
        }
        i.value = "";
    }

    function handleRAI(t) {
        let res = "Sistem RAI PT BKI aktif. Gunakan /kodeblue untuk verifikasi.";
        if(t.toLowerCase() === '/kodeblue') {
            db.ref('users/'+me.username).update({ verify: 'blue' });
            res = "VERIFIKASI BERHASIL ✓.";
        }
        setTimeout(() => { db.ref('chats/'+activeRid).push({ s: 'RAI', t: res, time: Date.now() }); }, 300);
    }

    function viewGroup() {
        db.ref('groups/'+activeRid).once('value', s => {
            const data = s.val(); if(!data) return;
            opM('Info Grup: '+data.name, '', '', false, '', null);
            const area = document.getElementById('custom-area');
            const btnDelG = document.getElementById('btn-del-g');
            if(me.username === data.admin) {
                btnDelG.className = "w-full bg-red-600 text-white py-4 rounded-xl font-black text-[9px] uppercase mt-4";
                btnDelG.onclick = () => { if(confirm("HAPUS GRUP?")) deleteGroup(activeRid); };
            }
            Object.keys(data.members).forEach(m => {
                const item = document.createElement('div');
                item.className = "flex justify-between items-center p-3 border-b text-[10px] font-bold uppercase";
                item.innerHTML = `<span>${m} ${m===data.admin?'👑':''}</span>`;
                if(me.username === data.admin && m !== me.username) {
                    const btn = document.createElement('button');
                    btn.className = "text-red-500 font-bold"; btn.innerText = "KICK";
                    btn.onclick = () => { db.ref('groups/'+activeRid+'/members/'+m).remove(); db.ref('mylists/'+m+'/'+activeRid).remove(); viewGroup(); };
                    item.appendChild(btn);
                }
                area.appendChild(item);
            });
        });
    }

    function deleteGroup(gid) {
        db.ref('groups/'+gid+'/members').once('value', s => {
            s.forEach(m => { db.ref('mylists/'+m.key+'/'+gid).remove(); });
            db.ref('groups/'+gid).remove(); db.ref('chats/'+gid).remove();
            exChat(); clsM();
        });
    }

    function srcU(u) {
        if(!u) return; const target = u.toLowerCase();
        db.ref('users/'+target).once('value', s => {
            if(s.exists()){ db.ref('mylists/'+me.username+'/'+target).update({isG:false, last:Date.now()}); openC(target, false); }
            else alert("User tidak ditemukan!");
        });
    }

    function createG(n) {
        if(!n) return; const id = 'GRP' + Date.now();
        db.ref('groups/'+id).set({ name: n, admin: me.username, members: { [me.username]: true } });
        db.ref('mylists/'+me.username+'/'+id).set({ isG: true, name: n });
    }

    function inviteM() {
        opM('Tambah Anggota','Username User','',true,'Tambah', uInput => {
            const u = uInput.toLowerCase().trim();
            if(!u) return;
            db.ref('users/' + u).once('value').then(snap => {
                if(snap.exists()) {
                    db.ref('groups/' + activeRid + '/members/' + u).set(true);
                    db.ref('groups/' + activeRid + '/name').once('value', nSnap => {
                        db.ref('mylists/' + u + '/' + activeRid).set({ isG: true, name: nSnap.val() || "Grup Baru" });
                        alert(u + " Berhasil ditambahkan!");
                    });
                } else { alert("Gagal: Username '" + u + "' tidak ada!"); }
            });
        });
    }

    function upFile(e, m) {
        const f = e.target.files[0]; if(!f) return;
        const r = new FileReader(); r.onload = (ev) => {
            if(m === 'av') db.ref('users/'+me.username+'/av').set(ev.target.result);
            else snd(ev.target.result);
        };
        r.readAsDataURL(f);
    }

    function delContact() { if(confirm("Hapus kontak?")) { db.ref('mylists/'+me.username+'/'+activeTarget).remove(); exChat(); } }
    function exChat() { if(sub) sub.off(); document.getElementById('room').classList.remove('screen-active'); activeRid=""; }
    const su=localStorage.getItem('rmu'), sp=localStorage.getItem('rmp');
    if(su && sp) { document.getElementById('ul').value=su; document.getElementById('pl').value=sp; doLogin(); }
</script>
</body>
</html>
