<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donasi RZONE & @maramadhona</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen">

<div class="bg-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-gray-700">
    <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-blue-400">RZONE DONATION</h1>
        <p class="text-gray-400 text-sm">Support @maramadhona</p>
    </div>

    <div id="input-section">
        <label class="block text-sm mb-2 text-gray-300">Nominal Donasi (Min. 100)</label>
        <input type="number" id="amount" class="w-full p-3 bg-gray-700 rounded-lg border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4" placeholder="Contoh: 10000">
        <button onclick="pay()" id="btn-pay" class="w-full bg-blue-600 hover:bg-blue-700 p-3 rounded-lg font-bold transition">Generate QRIS</button>
    </div>

    <div id="qris-section" class="hidden text-center">
        <div class="bg-white p-4 rounded-xl inline-block mb-4">
            <img id="qris-image" src="" alt="QRIS" class="w-64 h-64">
        </div>
        <p class="text-sm text-yellow-400 mb-2">Total: <span id="total-pay"></span> (Inc. Admin Rp 100)</p>
        <p class="text-xs text-gray-400">Status: <span id="payment-status" class="animate-pulse">Menunggu Pembayaran...</span></p>
    </div>
</div>

<script>
    async function pay() {
        const amount = document.getElementById('amount').value;
        if (amount < 100) return alert("Minimal donasi Rp 100");

        const btn = document.getElementById('btn-pay');
        btn.innerText = "Memproses...";
        btn.disabled = true;

        try {
            const res = await fetch('/api/donate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ amount })
            });
            const data = await res.json();

            if (data.qrData) {
                document.getElementById('input-section').classList.add('hidden');
                document.getElementById('qris-section').classList.remove('hidden');
                document.getElementById('qris-image').src = `https://api.qrserver.com/v1/create-qr-code/?data=${encodeURIComponent(data.qrData)}`;
                document.getElementById('total-pay').innerText = `Rp ${parseInt(amount) + 100}`;
                
                // Mulai polling cek status
                checkStatus(data.partnerReferenceNo);
            }
        } catch (e) {
            alert("Terjadi kesalahan.");
            btn.innerText = "Generate QRIS";
            btn.disabled = false;
        }
    }

    function checkStatus(refNo) {
        const interval = setInterval(async () => {
            const res = await fetch('/api/check-status', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ partnerReferenceNo: refNo })
            });
            const data = await res.json();

            if (data.status === 'PAID' || data.status === 'SUCCESS') {
                clearInterval(interval);
                document.getElementById('payment-status').innerText = "PEMBAYARAN BERHASIL!";
                document.getElementById('payment-status').classList.replace('text-gray-400', 'text-green-400');
                alert("Terima kasih atas donasinya!");
            }
        }, 5000);
    }
</script>

</body>
</html>
