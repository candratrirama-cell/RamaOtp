<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WACHANNEL BOOST - CUSTOM BY @MARAMADHONA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap');
        
        :root {
            --wa-green: #25d366;
            --wa-dark: #054c44;
            --wa-deep: #022c22;
            --accent: #fbbf24;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: radial-gradient(circle at center, var(--wa-dark), var(--wa-deep)); 
            color: #fff; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin: 0;
            overflow: hidden;
        }

        .premium-card { 
            background: rgba(255, 255, 255, 0.95); 
            border: 5px solid var(--wa-deep); 
            box-shadow: 15px 15px 0px var(--wa-green); 
            border-radius: 45px; 
            color: var(--wa-deep); 
            width: 100%; 
            max-width: 430px; 
            position: relative;
            backdrop-filter: blur(10px);
        }

        .input-group label {
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            font-style: italic;
            margin-bottom: 5px;
            display: block;
            color: var(--wa-dark);
        }

        .input-box { 
            border: 3px solid var(--wa-dark); 
            box-shadow: 4px 4px 0px var(--wa-dark); 
            width: 100%; 
            padding: 15px; 
            border-radius: 22px; 
            font-weight: 800; 
            outline: none; 
            background: #f0fff4;
            transition: 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .input-box:focus {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--wa-dark);
            background: #fff;
        }

        .btn-order { 
            background: var(--wa-green);
            color: white;
            border: 3px solid var(--wa-dark);
            box-shadow: 0px 7px 0px var(--wa-dark);
            border-radius: 28px;
            padding: 22px;
            font-weight: 900;
            font-size: 1.4rem;
            text-transform: uppercase;
            font-style: italic;
            width: 100%;
            transition: 0.1s;
        }

        .btn-order:active {
            transform: translateY(7px);
            box-shadow: 0px 0px 0px var(--wa-dark);
        }

        .total-container {
            background: var(--accent);
            border: 4px solid var(--wa-dark);
            box-shadow: 7px 7px 0px var(--wa-dark);
            border-radius: 30px;
            transform: rotate(-1.5deg);
            margin: 25px 0;
        }

        .server-badge {
            font-size: 10px;
            font-weight: 800;
            padding: 10px;
            border-radius: 15px;
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 2px solid var(--wa-dark);
        }

        .badge-s1 { background: #fee2e2; color: #991b1b; }
        .badge-s2 { background: #dcfce7; color: #166534; }

        .floating-moon {
            position: absolute;
            top: -30px;
            left: -15px;
            font-size: 3.5rem;
            filter: drop-shadow(0 0 15px var(--accent));
            animation: float 4s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-10deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }
    </style>
</head>
<body>

    <div class="p-4 w-full flex justify-center items-center">
        <div class="premium-card p-9 animate__animated animate__backInDown">
            <div class="floating-moon">🌙</div>
            
            <!-- Header -->
            <div class="text-center mb-10" id="headerLogo" style="cursor: pointer;">
                <h1 class="text-4xl font-black italic tracking-tighter uppercase leading-none text-emerald-900">
                    WA<span class="text-green-500">CHANNEL</span>
                </h1>
                <div class="flex items-center justify-center gap-2 mt-2">
                    <span class="bg-emerald-950 text-yellow-400 text-[10px] font-black px-4 py-1 rounded-full uppercase italic">RAMADHAN EDITION</span>
                </div>
                <div id="statusTag" class="hidden text-[10px] font-black text-orange-600 mt-2 animate-pulse uppercase italic">
                    ⚡ AUTO-GROW BOOSTER ACTIVE
                </div>
            </div>

            <!-- Form -->
            <div class="space-y-6">
                <div class="input-group">
                    <label>Pilih Tipe Server</label>
                    <select id="waServer" onchange="calculateTotal()" class="input-box text-sm">
                        <option value="s1">SERVER 1 (Rp 100/Foll)</option>
                        <option value="s2">SERVER 2 (Rp 200/Foll)</option>
                    </select>
                    <div id="serverDesc" class="server-badge badge-s1">
                        <span>⚠️</span> Server 1: Ekonomis. Bisa drop kapan saja.
                    </div>
                </div>

                <div class="input-group">
                    <label id="qtyLabel">Jumlah Followers (Min 10)</label>
                    <input type="number" id="waQty" oninput="calculateTotal()" placeholder="Contoh: 10" class="input-box">
                </div>

                <div class="input-group">
                    <label>Link Saluran WhatsApp</label>
                    <input type="text" id="waLink" placeholder="https://whatsapp.com/channel/..." class="input-box text-sm">
                </div>

                <!-- Price Display -->
                <div class="total-container p-6 text-center">
                    <p class="text-[11px] font-black uppercase opacity-60 mb-1">Estimasi Harga</p>
                    <h2 id="waTotal" class="text-4xl font-black italic text-emerald-950">Rp 0</h2>
                </div>

                <button onclick="handleOrder()" class="btn-order">
                    PESAN SEKARANG 🚀
                </button>

                <div class="text-center mt-6">
                    <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest italic">
                        Developed by @maramadhona
                    </p>
                    <p class="text-[8px] font-bold text-emerald-700 opacity-50 mt-1">Romash AI Gen 2 • Custom Core</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script>
        let isAutoGrow = false;

        function calculateTotal() {
            const server = document.getElementById('waServer').value;
            const qty = parseInt(document.getElementById('waQty').value) || 0;
            const desc = document.getElementById('serverDesc');
            let total = 0;

            if (server === 's1') {
                desc.innerHTML = "<span>⚠️</span> Server 1: Ekonomis. Bisa drop kapan saja.";
                desc.className = "server-badge badge-s1";
                if (qty >= 10) total = qty * 100;
            } else {
                desc.innerHTML = "<span>✅</span> Server 2: Premium. Garansi 7 Hari (Refill).";
                desc.className = "server-badge badge-s2";
                if (qty >= 10) total = qty * 200;
            }

            document.getElementById('waTotal').innerText = "Rp " + Math.floor(total).toLocaleString('id-ID');
        }

        document.getElementById('headerLogo').onclick = () => {
            isAutoGrow = !isAutoGrow;
            document.getElementById('statusTag').classList.toggle('hidden');
            if(isAutoGrow) {
                const colors = ['#25d366', '#fbbf24'];
                confetti({ particleCount: 40, colors: colors, origin: { y: 0.3 } });
            }
        };

        function handleOrder() {
            const server = document.getElementById('waServer').value;
            const qty = parseInt(document.getElementById('waQty').value) || 0;
            const link = document.getElementById('waLink').value;
            const price = document.getElementById('waTotal').innerText;
            const sName = server === 's1' ? "SERVER 1 (NON-GARANSI)" : "SERVER 2 (GARANSI 7 HARI)";

            if(qty < 10 || !link) {
                alert("Isi dulu link saluran sama jumlahnya bos! (Minimal 10)");
                return;
            }

            const waAdmin = "62882008519349"; 
            const msg = `ASSALAMUALAIKUM ADMIN%0AORDER WACHANNEL BOOST 🚀%0A%0A🖥️ SERVER: ${sName}%0A🔢 JUMLAH: ${qty} FOLLOWERS%0A🔗 LINK: ${link}%0A💰 TOTAL: ${price}${isAutoGrow ? '%0A⚡ MODE: AUTO-GROW AKTIF' : ''}%0A%0AProses min!`;

            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#25d366', '#054c44', '#ffffff']
            });

            setTimeout(() => {
                window.open(`https://wa.me/${waAdmin}?text=${msg}`, '_blank');
            }, 800);
        }
    </script>
</body>
</html>
