<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RMAIL RVI v4.0 - PT BKI</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #fe2c55; --bg: #000; --card: #161616; --border: rgba(255,255,255,0.08); }
        body { background: var(--bg); color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; height: 100dvh; margin: 0; overflow: hidden; }
        .scroll-area { flex: 1; overflow-y: auto; padding-bottom: 120px; -webkit-overflow-scrolling: touch; scroll-behavior: smooth; }
        .v-blue { display: inline-flex; align-items: center; justify-content: center; background: #0070f3; color: white; width: 14px; height: 14px; border-radius: 50%; font-size: 8px; margin-left: 5px; border: 1.5px solid black; }
        .screen { position: fixed; inset: 0; background: var(--bg); transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1000; display: flex; flex-direction: column; }
        .screen-active { transform: translateX(0); }
        .bubble { max-width: 85%; padding: 12px; border-radius: 18px; font-size: 14px; margin-bottom: 2px; position: relative; word-wrap: break-word; }
        .b-me { background: #0070f3; align-self: flex-end; border-bottom-right-radius: 4px; }
        .b-them { background: var(--card); align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid var(--border); }
        .avatar { width: 45px; height: 45px; border-radius: 15px; background: #222; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px solid var(--border); font-weight: 800; position: relative; flex-shrink: 0; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid #000; position: absolute; bottom: 0; right: 0; }
        .ts { font-size: 8px; opacity: 0.5; margin-bottom: 4px; display: block; }
        .glass-nav { background: rgba(0,0,0,0.85); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); z-index: 100; }
        .badge { background: #fe2c55; color: white; font-size: 10px; font-weight: 900; padding: 2px 8px; border-radius: 10px; }
        .btn-dl { background: rgba(255,255,255,0.1); padding: 6px 12px; border-radius: 10px; font-size: 9px; font-weight: 800; margin-top: 5px; display: inline-flex; align-items: center; gap: 5px; }
    </style>
</head>
<body>

<div id="gate" class="fixed inset-0 z-[9999] bg-black flex flex-col items-center justify-center p-10">
    <div class="w-20 h-20 bg-[#fe2c55] rounded-[24px] mb-8 flex items-center justify-center font-black text-white text-3xl shadow-[0_0_30px_#fe2c5566]">R</div>
    <div class="w-full max-w-xs space-y-3">
        <input type="text" id="ul" placeholder="USERNAME" class="w-full p-4 bg-[#111] border border-white/5 rounded-xl outline-none text-white text-center font-bold uppercase">
        <input type="password" id="pl" placeholder="PASSWORD" class="w-full p-4 bg-[#111] border border-white/5 rounded-xl outline-none text-white text-center font-bold">
        <button onclick="doLogin()" class="w-full bg-[#fe2c55] py-4 rounded-xl font-black text-white uppercase text-[10px]">Connect</button>
    </div>
</div>

<div class="flex flex-col h-screen">
    <header class="p-6 pt-14 flex justify-between items-center glass-nav">
        <div class="flex items-center gap-3">
            <div id="my-av" onclick="document.getElementById('f-av').click()" class="avatar cursor-pointer">?</div>
            <div>
                <h1 id="my-name" class="text-xs font-black uppercase inline-block">...</h1><span id="my-v-badge"></span>
                <p class="text-[7px] text-green-500 uppercase font-black">PT BANGGA KARYA INDONESIA</p>
            </div>
        </div>
        <div class="flex gap-2">
            <button onclick="opM('Cari User','Username','',true,'Cari',u=>srcU(u))" class="w-10 h-10 bg-white/5 rounded-full flex items-center justify-center">🔍</button>
            <button onclick="logout()" class="w-10 h-10 bg-red-500/20 text-red-500 rounded-full flex items-center justify-center text-[8px] font-black uppercase">Exit</button>
        </div>
    </header>
    <div id="list" class="scroll-area p-4 space-y-2"></div>
</div>

<div id="room" class="screen">
    <header class="p-4 pt-14 flex items-center gap-3 glass-nav">
        <button onclick="exChat()" class="p-2 text-xl">←</button>
        <div id="r-av" class="avatar !w-10 !h-10"></div>
        <div class="flex-1">
            <h3 id="r-name" class="font-bold text-xs uppercase truncate inline-block">...</h3><span id="r-v-badge"></span>
            <p id="r-status" class="text-[6px] font-black uppercase text-gray-500">Offline</p>
        </div>
    </header>
    <div id="canvas" class="scroll-area p-5 flex flex-col"></div>
    <div id="typing-status" class="text-[8px] text-[#fe2c55] font-black px-5 mb-2 hidden uppercase">Rama AI Berpikir...</div>
    <div class="p-4 glass-nav flex items-center gap-2 pb-10">
        <button onclick="document.getElementById('f-up').click()" class="w-10 h-10 bg-white/5 rounded-xl flex items-center justify-center">📎</button>
        <input type="text" id="mi" placeholder="Ketik pesan..." class="flex-1 bg-white/10 p-4 rounded-2xl outline-none text-sm text-white">
        <button onclick="snd()" class="w-12 h-12 bg-[#fe2c55] rounded-xl flex items-center justify-center font-black">↑</button>
    </div>
</div>

<div id="modal" class="fixed inset-0 z-[9999] bg-black/95 hidden items-center justify-center p-8 backdrop-blur-md">
    <div class="bg-white text-black p-8 rounded-[30px] w-full max-w-xs text-center">
        <h3 id="mt" class="font-black uppercase text-[10px] mb-4 text-gray-400"></h3>
        <input type="text" id="mv" class="w-full bg-gray-100 p-4 rounded-xl outline-none mb-4 font-bold text-center">
        <div class="flex gap-2"><button onclick="clsM()" class="flex-1 font-bold text-[9px] uppercase border p-4 rounded-xl">Batal</button><button id="mok" class="flex-1 bg-black text-white py-4 rounded-xl font-black text-[9px] uppercase">Ok</button></div>
    </div>
</div>

<input type="file" id="f-av" class="hidden" onchange="upFile(event)">
<input type="file" id="f-up" class="hidden" onchange="handleFileUp(event)">

<script>
    const cfg = { databaseURL: "https://rmail-68719-default-rtdb.asia-southeast1.firebasedatabase.app" };
    firebase.initializeApp(cfg);
    const db = firebase.database();
    let me = null, activeRid = "", activeTarget = "", sub = null, loadedMsgs = new Set();

    function doLogin() {
        const u = document.getElementById('ul').value.trim().toLowerCase();
        const p = document.getElementById('pl').value.trim();
        if(!u || !p) return;
        db.ref('users/'+u).once('value', s => {
            if(s.exists() && s.val().password === p) { me = s.val(); loginSuccess(u); }
            else if(!s.exists()) { const n = { username: u, password: p, verify: 'none', status: 'online' }; db.ref('users/'+u).set(n).then(() => { me = n; loginSuccess(u); }); }
            else alert("Password Salah!");
        });
    }

    function loginSuccess(u) { 
        localStorage.setItem('rmu',u); localStorage.setItem('rmp',document.getElementById('pl').value);
        db.ref('users/'+u+'/status').onDisconnect().set('offline');
        db.ref('users/'+u+'/status').set('online');
        init(); 
    }

    function logout() { localStorage.clear(); location.reload(); }
    
    function init() {
        document.getElementById('gate').style.display = 'none';
        db.ref('users/'+me.username).on('value', s => { 
            me = s.val(); document.getElementById('my-name').innerText = me.username;
            const b = document.getElementById('my-v-badge');
            b.className = me.verify === 'blue' ? 'v-blue' : ''; b.innerText = b.className ? '✓' : '';
            if(me.av) document.getElementById('my-av').innerHTML = `<img src="${me.av}">`;
            else document.getElementById('my-av').innerText = me.username[0].toUpperCase();
        });
        loadList();
    }

    function loadList() {
        db.ref('mylists/'+me.username).on('value', snap => {
            const list = document.getElementById('list'); list.innerHTML = "";
            let contacts = []; snap.forEach(it => { contacts.push({ key: it.key, last: it.val().last || 0, unread: it.val().unread || 0 }); });
            contacts.sort((a, b) => b.last - a.last);
            contacts.forEach(item => {
                const t = item.key;
                const div = document.createElement('div');
                div.className = "p-4 flex items-center gap-4 bg-white/5 rounded-[22px] border border-white/5 mb-2 active:scale-95 transition-transform";
                div.innerHTML = `<div class="avatar" id="lav-${t}">${t[0].toUpperCase()}</div><div class="flex-1" onclick="openC('${t}')" oncontextmenu="event.preventDefault(); delC('${t}')"><div class="flex justify-between items-center"><h4 class="font-extrabold text-xs uppercase">${t} <span id="lv-${t}"></span></h4><span id="ub-${t}" class="badge" style="display:${item.unread > 0 ? 'block':'none'}">${item.unread}</span></div><p class="text-[7px] opacity-30 font-black uppercase">PT BKI</p></div>`;
                list.appendChild(div);
                db.ref('users/'+t).on('value', s => {
                    const u = s.val(); if(!u) return;
                    const avBox = div.querySelector('.avatar');
                    const dotClass = u.status === 'online' ? 'bg-green-500 shadow-[0_0_8px_#22c55e]' : 'bg-gray-500';
                    if(u.av) avBox.innerHTML = `<img src="${u.av}"><div class="status-dot ${dotClass}"></div>`;
                    else avBox.innerHTML = `<span>${t[0].toUpperCase()}</span><div class="status-dot ${dotClass}"></div>`;
                    const b = div.querySelector('#lv-'+t); if(b) { b.className = u.verify==='blue' ? 'v-blue' : ''; b.innerText = b.className ? '✓' : ''; }
                });
            });
        });
    }

    function delC(t) { if(confirm(`Hapus kontak ${t}?`)) db.ref('mylists/'+me.username+'/'+t).remove(); }

    function openC(t) {
        if(sub) sub.off(); activeTarget = t; activeRid = [me.username, t].sort().join("_");
        document.getElementById('room').classList.add('screen-active');
        document.getElementById('r-name').innerText = t;
        document.getElementById('canvas').innerHTML = ""; loadedMsgs.clear();
        db.ref('mylists/'+me.username+'/'+t).update({ unread: 0 });
        db.ref('users/'+t).on('value', s => {
            const u = s.val(); if(!u) return;
            document.getElementById('r-status').innerText = u.status === 'online' ? 'Online' : 'Offline';
            document.getElementById('r-status').className = `text-[6px] font-black uppercase ${u.status === 'online' ? 'text-green-500' : 'text-gray-500'}`;
            if(u.av) document.getElementById('r-av').innerHTML = `<img src="${u.av}">`;
            else document.getElementById('r-av').innerText = t[0].toUpperCase();
            const b = document.getElementById('r-v-badge');
            b.className = u.verify === 'blue' ? 'v-blue' : ''; b.innerText = b.className ? '✓' : '';
        });
        sub = db.ref('chats/'+activeRid);
        sub.on('child_added', snap => { if(!loadedMsgs.has(snap.key)) { loadedMsgs.add(snap.key); renderMsg(snap.key, snap.val()); } });
    }

    function renderMsg(id, d) {
        const time = new Date(d.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const div = document.createElement('div');
        div.className = `flex flex-col ${d.s === me.username ? 'items-end' : 'items-start'} mb-4`;
        let content = d.t;
        if(d.type === 'image') content = `<img src="${d.file}" class="rounded-xl w-64 shadow-lg" onload="scrollToBottom()"><a href="${d.file}" download="RMAIL_${id}.png" class="btn-dl">📥 SIMPAN</a>`;
        div.innerHTML = `<span class="ts">${time}</span><div class="bubble ${d.s === me.username ? 'b-me' : 'b-them'}" oncontextmenu="event.preventDefault(); if('${d.s===me.username}'==='true' && confirm('Hapus?')) db.ref('chats/'+activeRid+'/'+'${id}').remove();">${content}</div>`;
        document.getElementById('canvas').appendChild(div);
        scrollToBottom();
    }

    function scrollToBottom() { const c = document.getElementById('canvas'); c.scrollTop = c.scrollHeight; }

    async function snd() {
        const i = document.getElementById('mi'), t = i.value.trim(); if(!t) return;
        const now = Date.now(); i.value = "";
        
        if(t === '/cenru') { db.ref('users/'+me.username+'/verify').set('blue'); return; }
        if(t === '/umcen') { db.ref('users/'+me.username+'/verify').set('none'); return; }
        
        const rid = activeRid, target = activeTarget;
        await db.ref('chats/'+rid).push({ s: me.username, t: t, time: now });
        db.ref('mylists/'+me.username+'/'+target).update({ last: now });
        db.ref('mylists/'+target+'/'+me.username).transaction(v => {
            return { last: now, unread: ((v && v.unread) || 0) + 1 };
        });
        if(target === 'rama') handleRamaAI(t, rid);
    }

    async function handleRamaAI(prompt, rid) {
        if(activeTarget === 'rama') document.getElementById('typing-status').classList.remove('hidden');
        const now = Date.now();
        let resData = { s:'rama', time: now };
        try {
            if (prompt.toLowerCase().includes("gambar") || prompt.toLowerCase().includes("foto")) {
                const seed = Math.floor(Math.random() * 999999);
                const img = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?seed=${seed}&width=1024&height=1024&nologo=true`;
                resData.t = 'Sesuai pesanan, Pak Rama:'; resData.type = 'image'; resData.file = img;
            } else {
                const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}?model=openai&system=Kamu Rama AI asisten PT Bangga Karya Indonesia.`);
                resData.t = await res.text();
            }
            
            await db.ref('chats/'+rid).push(resData);
            
            // Logic angka pesan baru jika user sedang di luar chat Rama
            if(activeTarget !== 'rama') {
                db.ref('mylists/'+me.username+'/rama').transaction(v => {
                    return { last: now, unread: ((v && v.unread) || 0) + 1 };
                });
            } else {
                db.ref('mylists/'+me.username+'/rama').update({ last: now, unread: 0 });
            }
        } catch (e) {}
        if(activeTarget === 'rama') document.getElementById('typing-status').classList.add('hidden');
    }

    function exChat() { if(sub) sub.off(); document.getElementById('room').classList.remove('screen-active'); activeTarget = ""; }
    function opM(t,d,p,h,b,c) { document.getElementById('mt').innerText=t; document.getElementById('mv').placeholder=d; document.getElementById('modal').style.display='flex'; mCB=c; }
    function clsM() { document.getElementById('modal').style.display='none'; }
    document.getElementById('mok').onclick=()=>{ if(mCB) mCB(document.getElementById('mv').value.trim()); clsM(); };
    
    function srcU(u) { 
        if(!u) return; 
        const target = u.toLowerCase();
        db.ref('users/'+target).once('value', s => { 
            if(s.exists()) { 
                db.ref('mylists/'+me.username+'/'+target).update({last: Date.now()}); 
                openC(target); 
            } else { alert("User tidak ditemukan"); }
        }); 
    }

    function upFile(e) { 
        const f = e.target.files[0]; 
        const r = new FileReader(); 
        r.onload = (ev) => { db.ref('users/'+me.username+'/av').set(ev.target.result); }; 
        r.readAsDataURL(f); 
    }

    function handleFileUp(e) {
        const f = e.target.files[0]; if(!f) return;
        const r = new FileReader(); 
        r.onload = async (ev) => {
            const now = Date.now();
            await db.ref('chats/'+activeRid).push({ s: me.username, type: 'image', file: ev.target.result, time: now });
            db.ref('mylists/'+me.username+'/'+activeTarget).update({ last: now });
        }; 
        r.readAsDataURL(f);
    }

    const su=localStorage.getItem('rmu'), sp=localStorage.getItem('rmp'); 
    if(su && sp) { document.getElementById('ul').value=su; document.getElementById('pl').value=sp; doLogin(); }
</script>
</body>
</html>
