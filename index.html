<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Ditutup</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #0f0f0f;
      color: #ffffff;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .container {
      padding: 30px;
      max-width: 500px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 15px;
      color: #ff4d4d;
    }

    p {
      font-size: 16px;
      line-height: 1.6;
      opacity: 0.85;
    }

    .footer {
      margin-top: 25px;
      font-size: 13px;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚫 Website Ditutup</h1>
    <p>
      Website ini telah <b>ditutup sepenuhnya oleh developer</b>.<br>
      Tidak ada layanan, fitur, atau akses yang tersedia.
    </p>

    <div class="footer">
      © 2026 — Developer
    </div>
  </div>
</body>
</html>
