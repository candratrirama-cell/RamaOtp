<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stevana Pro Fix - GoR 1.1 Lock</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap');
        :root { --primary: #FF9F43; --success: #2ECC71; --danger: #FF7675; --blue: #0984E3; --bg: #6C5CE7; }
        body { font-family: 'Nunito', sans-serif; background: var(--bg); margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #login-screen { position: fixed; inset: 0; background: var(--primary); z-index: 2000; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .btn-google { background: white; color: #444; padding: 15px 30px; border-radius: 50px; border: none; font-weight: 900; display: flex; align-items: center; gap: 10px; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .app-container { background: white; width: 92%; max-width: 450px; height: 90vh; border-radius: 40px; position: relative; display: none; flex-direction: column; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
        .header { background: #f1f2f6; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 3px solid #dfe4ea; }
        .user-pp { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--primary); }
        .points-badge { background: var(--success); color: white; padding: 5px 12px; border-radius: 15px; font-weight: 900; }
        #leaderboard { position: absolute; inset: 0; background: white; z-index: 100; display: none; flex-direction: column; padding: 20px; }
        .rank-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
        .game-content { flex: 1; padding: 20px; text-align: center; overflow-y: auto; }
        .maskot-frame { width: 120px; height: 120px; margin: 10px auto; border: 5px solid var(--primary); border-radius: 50%; overflow: hidden; }
        .maskot-frame img { width: 100%; height: 100%; object-fit: contain; }
        .bubble { background: #f9f9f9; padding: 20px; border-radius: 25px; border: 3px solid #eee; margin: 15px 0; min-height: 80px; }
        .btn-action { width: 100%; padding: 18px; border: none; border-radius: 25px; font-size: 1.1rem; font-weight: 900; color: white; margin-bottom: 10px; cursor: pointer; }
        .btn-listen { background: #00b894; box-shadow: 0 5px 0 #00896f; }
        .btn-speak { background: var(--primary); box-shadow: 0 5px 0 #e17055; }
        .btn-speak.active { background: var(--danger); transform: translateY(5px); box-shadow: none; }
        .nav-bar { display: flex; gap: 10px; padding: 10px 20px 20px; }
        .nav-bar button { flex: 1; padding: 12px; border: none; border-radius: 15px; font-weight: 900; cursor: pointer; }
    </style>
</head>
<body>

<div id="login-screen">
    <h1 style="font-family:'Fredoka One'; font-size: 4rem; color: white; margin-bottom: 5px;">STEVANA</h1>
    <p style="color: white; font-weight: 900; margin-bottom: 25px;">@maramadhona Project</p>
    <button class="btn-google" onclick="loginGoogle()">
        <img src="https://cdn1.iconfinder.com/data/icons/google-s-logo/150/Google_Icons-09-512.png" width="25">
        LOGIN WITH GOOGLE
    </button>
</div>

<div class="app-container" id="app">
    <div class="header">
        <div style="display:flex; align-items:center; gap:10px;">
            <img id="user-pfp" class="user-pp" src="">
            <span id="user-name" style="font-weight:900; font-size:0.8rem;">Loading...</span>
        </div>
        <div class="points-badge"><span id="score-val">0</span> PTS</div>
        <button onclick="showRank()" style="background:none; border:none; font-size:1.5rem; cursor:pointer;">🏆</button>
    </div>

    <div id="leaderboard">
        <h2 style="font-family:'Fredoka One'; color:var(--primary); text-align:center;">GLOBAL RANKING</h2>
        <div id="leaderboard-list" style="flex:1; overflow-y:auto;"></div>
        <button class="btn-action" style="background:var(--bg);" onclick="closeRank()">CLOSE</button>
    </div>

    <div class="game-content">
        <div id="lvl-txt" style="font-weight:900; color:var(--primary);">LEVEL 1 / 100</div>
        <div class="maskot-frame"><img id="m-img" src="https://i.ibb.co/xSr3XPBc/1771380820266-1.jpg"></div>
        <div class="bubble"><div id="target" style="font-weight:900; color:var(--blue); font-size:1.2rem;">Are you ready?</div></div>
        <div id="feedback" style="margin-bottom:10px; font-weight:bold; height:20px;"></div>
        <button class="btn-action btn-listen" onclick="playVoice()">🔊 LISTEN OYEN</button>
        <button class="btn-action btn-speak" id="btn-mic" onclick="startRec()">🎤 START SPEAKING</button>
    </div>

    <div class="nav-bar">
        <button onclick="nav(-1)">BACK</button>
        <button onclick="nav(1)" style="background:var(--blue); color:white;">NEXT</button>
    </div>
</div>

<script>
    // KONFIGURASI FIREBASE KAMU
    const firebaseConfig = {
        apiKey: "AIzaSyBn6vVKvPf74V7UUsWWnTI9uRh5FI_urK0",
        authDomain: "rzones-c08ee.firebaseapp.com",
        databaseURL: "https://rzones-c08ee-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "rzones-c08ee",
        storageBucket: "rzones-c08ee.firebasestorage.app",
        messagingSenderId: "411533215268",
        appId: "1:411533215268:web:238dbba66bef4907f0fab1"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();
    const provider = new firebase.auth.GoogleAuthProvider();

    let currentUser = null;
    let userScore = 0;
    let currentLevel = 0;

    const questions = ["What is your name?", "How old are you?", "What is your favorite color?"];
    for(let i=4; i<=100; i++) questions.push("Sentence practice " + i);

    // FUNGSI LOGIN (Global agar bisa dipanggil onclick)
    window.loginGoogle = function() {
        console.log("Mencoba login...");
        auth.signInWithPopup(provider).catch(err => {
            console.error(err);
            // Jika popup diblokir, gunakan redirect
            auth.signInWithRedirect(provider);
        });
    };

    auth.onAuthStateChanged((user) => {
        if (user) {
            currentUser = user;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app').style.display = 'flex';
            document.getElementById('user-pfp').src = user.photoURL;
            document.getElementById('user-name').innerText = user.displayName;
            
            // Sync Database
            db.ref('users/' + user.uid).on('value', (snapshot) => {
                if (snapshot.exists()) {
                    userScore = snapshot.val().score || 0;
                } else {
                    db.ref('users/' + user.uid).set({ name: user.displayName, photo: user.photoURL, score: 0 });
                }
                document.getElementById('score-val').innerText = userScore;
            });

            // Suara "Ste vana!"
            const ut = new SpeechSynthesisUtterance("Ste vana!");
            ut.pitch = 2; ut.rate = 1.2; window.speechSynthesis.speak(ut);
            render();
        }
    });

    function render() {
        document.getElementById('target').innerText = questions[currentLevel];
        document.getElementById('lvl-txt').innerText = `LEVEL ${currentLevel + 1} / 100`;
        document.getElementById('feedback').innerText = "";
    }

    window.playVoice = () => {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(questions[currentLevel]);
        u.lang = 'en-US'; window.speechSynthesis.speak(u);
    };

    window.startRec = () => {
        const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(!Rec) return alert("Mic Error!");
        const r = new Rec(); r.lang = 'en-US';
        r.onstart = () => document.getElementById('btn-mic').classList.add('active');
        r.onresult = (e) => {
            document.getElementById('btn-mic').classList.remove('active');
            const say = e.results[0][0].transcript.toLowerCase();
            if(say.includes(questions[currentLevel].toLowerCase().replace(/[^\w\s]/g, ""))) {
                userScore += 2;
                db.ref('users/' + currentUser.uid).update({ score: userScore });
                document.getElementById('feedback').innerText = "CORRECT! +2";
            }
        };
        r.start();
    };

    window.nav = (d) => { currentLevel = Math.max(0, Math.min(99, currentLevel + d)); render(); };
    window.showRank = () => {
        document.getElementById('leaderboard').style.display = 'flex';
        db.ref('users').orderByChild('score').limitToLast(10).on('value', (snap) => {
            let html = "";
            let users = [];
            snap.forEach(child => { users.push(child.val()); });
            users.reverse().forEach((p, i) => {
                html += `<div class="rank-item"><span>#${i+1} ${p.name}</span><span>${p.score} PTS</span></div>`;
            });
            document.getElementById('leaderboard-list').innerHTML = html;
        });
    };
    window.closeRank = () => { document.getElementById('leaderboard').style.display = 'none'; };
</script>
</body>
</html>
